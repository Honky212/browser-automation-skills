[pytest]
# pytest configuration file（工作区根；与包内 src/browser_automation_skills/pytest.ini 保持一致）

# Test file matching patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Async test configuration
# 注意：必须为 auto，否则 async def 测试在 pytest-asyncio strict 模式下会被跳过
asyncio_mode = auto

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers configuration
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests

# Timeout setting (60 seconds per test)
timeout = 60

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
